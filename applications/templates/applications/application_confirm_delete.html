{% extends "base.html" %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 border-danger">
            <div class="card-body text-center">
                <i class="bi bi-exclamation-triangle-fill fs-1 text-danger mb-2 d-block"></i>
                <h4 class="fw-bold">Delete Application?</h4>
                <p class="text-muted mb-4">
                    Are you sure you want to remove your application record for 
                    <strong>{{ application.opportunity.title }}</strong> at 
                    <strong>{{ application.opportunity.company.name }}</strong>?
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <a href="{% url 'applications:list' %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger">Confirm Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
